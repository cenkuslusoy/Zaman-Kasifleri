name: Build Zaman Kasifleri APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API server URL for this APK (leave blank for hosted server)'
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Android source
        run: test -f zaman_kasifleri/app/src/main/java/com/zamankasifleri/app/MainActivity.kt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          if [ -n "$API_BASE_URL" ]; then
            gradle --no-daemon -p zaman_kasifleri -PapiBaseUrl="$API_BASE_URL" :app:assembleDebug
          else
            gradle --no-daemon -p zaman_kasifleri :app:assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zaman-kasifleri-apk
          path: zaman_kasifleri/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
