
name: Build Zaman Kasifleri APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'zaman_kasifleri_mvp_kaynak.zip'
      - '.github/workflows/android-apk.yml'
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source archive
        run: unzip -q zaman_kasifleri_mvp_kaynak.zip

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

       - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

            - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon -p zaman_kasifleri :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zaman-kasifleri-apk
          path: zaman_kasifleri/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          
