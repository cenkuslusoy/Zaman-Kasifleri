<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172b4d"><meta name="description" content="Alp ile zamanda yolculuklarla dolu resimli maceralar."><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/style.css"><title>Zaman Kaşifleri</title></head>
<body><header class="top"><div class="brand"><span class="logo">🧭</span><div><b>ZAMAN KAŞİFLERİ</b><small>Alp'in macera günlüğü</small></div></div><button id="archiveBtn" class="ghost">📚 Arşivim</button></header>
<main><section id="home" class="hero"><div class="eyebrow">HER SAYFADA YENİ BİR DÜNYA</div><h1>Hazır mısın<br><em>Alp kaşif?</em></h1><p>Bir zaman seç, bir görev belirle. Maceranı birlikte yazalım!</p>

<div class="row"><div><label for="age">Yaş</label><select id="age"><option>4</option><option selected>5</option><option>6</option></select></div><div><label for="minutes">Okuma süresi</label><select id="minutes"><option>3</option><option selected>5</option><option>7</option><option>10</option></select></div></div>
<button id="start" class="primary">🚀 Macerayı başlat</button><p id="status" class="status" aria-live="polite"></p></div>
<div class="footnote">🌟 Her macera Alp'e özel hazırlanır.</div></section>
<section id="reader" class="reader hidden"><button id="back" class="ghost">← Yeni macera</button><div class="book"><div id="progress" class="progress"></div><div id="storyContent"></div><div class="nav"><button id="prev" class="ghost">← Önceki</button><span id="pageNo"></span><button id="next" class="primary small">Sonraki →</button></div></div></section>
